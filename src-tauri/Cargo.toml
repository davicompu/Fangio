[package]
name = "reeves"
version = "0.3.0"
description = "Reeves — systematic literature reviews on your own machine"
authors = ["Reeves contributors"]
edition = "2021"

[[bin]]
name = "Reeves"
path = "src/main.rs"

[lib]
name = "reeves_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime + HTTP client (only used against localhost by default)
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Local SQLite via sqlx
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate", "json", "chrono"] }

# Misc
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
csv = "1.3"
strsim = "0.11"
unicode-normalization = "0.1"
pdf-extract = "0.7"
bytemuck = "1"
docx-rs = "0.4"
sha2 = "0.10"

[features]
# default to a network configuration where ONLY localhost reqwest calls are
# permitted. Database connectors compile in but are gated behind runtime
# allowlist checks (see allowlist.rs).
default = []

[dev-dependencies]
tempfile = "3"
